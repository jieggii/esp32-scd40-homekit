[env:esp32dev]
; pioarduino ships Arduino-ESP32 core 3.x, which HomeSpan 2.x requires
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; HomeSpan + Wi-Fi doesn't fit the default 1.25 MB app partition
board_build.partitions = min_spiffs.csv
lib_deps =
    homespan/HomeSpan@^2.1.0
    sensirion/Sensirion I2C SCD4x@^1.0.0
